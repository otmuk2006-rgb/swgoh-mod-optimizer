<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}SWGOH Mod Optimiser{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <span class="app-title">Mod Optimiser</span>
      <nav class="app-steps">
        {% for s in nav_steps|default([]) %}
          {% if s.enabled %}
            <a class="step {{ 'active' if step == s.key }}" href="{{ s.url }}">{{ s.label }}</a>
          {% else %}
            <span class="step">{{ s.label }}</span>
          {% endif %}
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
