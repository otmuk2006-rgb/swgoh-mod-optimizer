services:
  # Game-data microservice (github.com/swgoh-utils/swgoh-comlink). Render
  # has no free tier for private services (type: pserv) — only the "web"
  # type does — so this is a public web service instead. Still locked down:
  # ACCESS_KEY/SECRET_KEY below turn on Comlink's own HMAC request signing
  # (confirmed in its docs — request signing is enforced once these are
  # set, not just advisory), so a request without a valid signature gets
  # rejected regardless of who sends it. Our own app's calls to it are
  # signed automatically by the swgoh_comlink pip client whenever these
  # same two env vars are present (see utils.get_comlink_client()).
  - name: swgoh-comlink
    type: web
    runtime: image
    plan: free
    image:
      url: ghcr.io/swgoh-utils/swgoh-comlink:latest
    envVars:
      - key: PORT
        value: "3000"
      - key: ACCESS_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

  # The Flask app itself. Single worker, threaded — see the SESSIONS
  # comment block at the top of ui/app.py for why (background solve/refresh
  # threads need to share process memory with the request that started them).
  - name: swgoh-mod-optimizer
    type: web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --worker-class gthread --threads 8 --timeout 120 --bind 0.0.0.0:$PORT ui.app:app
    healthCheckPath: /healthz
    envVars:
      - key: COMLINK_URL
        fromService:
          name: swgoh-comlink
          type: web
          property: hostport
      - key: ACCESS_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      # Off by default — the two community-data-refresh routes are heavy
      # and /refresh/priority runs a real Selenium/Chrome scrape against
      # swgoh.gg. Refresh locally and redeploy the resulting JSON instead;
      # only flip this to "true" temporarily if you specifically need to
      # trigger a refresh from the deployed environment.
      - key: ADMIN_REFRESH_ENABLED
        value: "false"
